<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">​
</head>​

<body>
    <div class="container">
        <header class="row">
            <nav class="col navbar bg-dark text-white">
                <ul class="nav">
                    <li class="nav-item"> <a class="nav-link" href="../index.html"> Back </a></li>
                </ul>
            </nav>
        </header>
        <main class="row">
            <section class="col">
                <h1> Video </h1>
                <video src="../img/Aiken.mp4" preload="auto" loop autoplay muted height="500" width="500"> Video Failed To Load</video>
            </section>

            <section class="col mt-2">
                <h1>Feedback Form</h1>
                <form name="feedback">
                    <div class="form-floating mb-3">
                        <input type="text" class="form=control" maxlength="20" name="fname" placeholder="anonymous" required>
                        <label for="fname">First Name</label>
                    </div>
                    
                    <label>Last Name</label> <input type="text" maxlength="20" name="lname" placeholder="anonymous" required>
                    <br>
                    <label>Email</label> <input type="email" placeholder="name@domain.com" name="mail">
                    <label>Would you recommend this website? Yes</label> <input type="radio" name="yes"> <label>No</label> <input type="radio" name="no">
                    <br>
                    <label> What is your favorite website?</label>
                    <select name="fwebsite">
                        <option value="Google"> Google </option>
                        <option value="Facebook"> Facebook </option>
                        <option value="Youtube"> Youtube </option>
                        <option value="Instagram"> Instagram </option>
                        <option value="Bing"> Bing </option>
                        <option value="This Website"> This Website </option>
                    </select>
                    <label>Rate This Website 1</label> <input type="range" min="1" max="10" name="rating"> <label>10</label>
                    <br>
                    <label>Leave any comments here</label> <input type="text" name="comments">
                    <label>What is your favorite color?</label> <input type="color" name="fcolor">
                    <br>
                    <label>Birthday</label> <input type="date" name="bdate">
                    <label>Phone Number</label> <input type="tel" name="pnum" placeholder="xxx-xxx-xxxx" pattern="\d{3}-\d{3}-\d{4}">
                    <br>
                    <input type="submit" name="submit">
                </form>
            </section>
        </main>

        <footer class="row">
            <a href="../index.html"> Back</a>
        </footer>   
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
